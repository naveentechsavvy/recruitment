spring.application.name=recruitment-backend
server.port=8080

# ---- MySQL (credentials come from environment variables) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:recruitment_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate ----
# "update" creates/updates tables automatically. Fine for development;
# use a migration tool (Flyway/Liquibase) before going to production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Uploads (logos are limited to 500 KB in FileStorageService; resumes use app.resume.max-size-mb) ----
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
app.upload-dir=${UPLOAD_DIR:uploads}

# ---- Resumes (private folder, never served as a public URL) ----
app.resume-dir=${RESUME_DIR:private-resumes}
# Largest resume accepted, in MB. Keep it below spring.servlet.multipart.max-file-size.
app.resume.max-size-mb=${RESUME_MAX_MB:5}

# ---- CORS: which frontends may call this API (comma-separated) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Public address of THIS backend. Used to build logo URLs in emails and on the set-password page.
# Set PUBLIC_BASE_URL to the real public address when you deploy.
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

# ---- Login / JWT (NEW) ----
# Set JWT_SECRET (32+ characters) in real environments. The default below is for local development only.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.expiry-hours=12

# First admin account, created automatically on startup if it does not exist yet.
app.admin.email=${ADMIN_EMAIL:contact@velzenixnova.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# ---- User invitation email (configure SMTP values in environment variables) ----
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.invitation.expiry-hours=${INVITATION_EXPIRY_HOURS:24}

# ---- Offer letter (emailed when the Offer Released step is approved) ----
# Optional: path of your own offer letter template (text file). Empty = the built-in offer-letter-template.txt.
app.offer.template-path=${OFFER_TEMPLATE_PATH:}
# Written after the CTC number in the letter, e.g. "15 LPA". Leave empty to print the plain number.
app.offer.ctc-unit=${OFFER_CTC_UNIT:LPA}
