<div class="wrap">
  <div class="card panel">
    <img class="logo" [src]="logoFull" alt="Velzenix Nova" />
    <h1>Admin Portal</h1>
    <p class="sub">Sign in to manage clients and recruitment configurations.</p>
    @if (error) { <div class="alert error">{{ error }}</div> }
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="email">Email <span class="req">*</span></label>
        <input id="email" class="input" type="email" formControlName="email" [class.invalid]="invalid('email')" autocomplete="username" />
        @if (invalid('email')) { <span class="error">Enter a valid email address.</span> }
      </div>
      <div class="field">
        <label for="password">Password <span class="req">*</span></label>
        <input id="password" class="input" type="password" formControlName="password" [class.invalid]="invalid('password')" autocomplete="current-password" />
        @if (invalid('password')) { <span class="error">Password must be at least 4 characters.</span> }
      </div>
      <button class="btn primary full" type="submit">Login</button>
    </form>
    <p class="note">Demo mode: any valid email and a 4+ character password will work.</p>
  </div>
</div>
